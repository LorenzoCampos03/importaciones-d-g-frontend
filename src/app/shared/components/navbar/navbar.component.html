<header class="sticky top-0 z-30 h-16 bg-white border-b border-gray-200 shadow-sm transition-all duration-300 w-full">
  <div class="h-full flex items-center justify-between px-4 md:px-6 max-w-none">
    <button
      data-mobile-toggle
      class="md:hidden p-2 rounded-lg text-gray-800 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-40 transition-all duration-200 shadow-sm"
      (click)="toggleMobileMenu()"
    >
      <i
        class="fas transition-transform duration-200"
        [ngClass]="{
          'fa-chevron-right': (isCollapsed$ | async),
          'fa-chevron-left': !(isCollapsed$ | async)
        }"
      ></i>
    </button>

    <div class="hidden md:flex items-center">
      <button
        class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-40"
        (click)="toggleSidebar()"
      >
        <i
          class="fas transition-transform duration-200"
          [ngClass]="{
            'fa-chevron-right': (isCollapsed$ | async),
            'fa-chevron-left': !(isCollapsed$ | async)
          }"
        ></i>
      </button>
    </div>

    <div class="flex-1 text-center">
      <h1 class="text-xl font-bold text-gray-800 truncate">Panel Principal</h1>
    </div>

    <div *ngIf="currentUser" class="flex items-center space-x-3">
      <div class="text-right hidden sm:block">
        <p class="font-semibold text-gray-800 text-sm truncate max-w-32">
          {{ currentUser.name }} {{ currentUser.lastName }}
        </p>
        <p class="text-xs text-gray-500 truncate">{{ currentUser.role }}</p>
      </div>

      <div
        class="user-avatar w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md cursor-pointer hover:shadow-lg transition-shadow duration-200 flex-shrink-0"
      >
        {{ currentUser.name[0] || 'U' }}{{ currentUser.lastName[0] || '' }}
      </div>
    </div>
  </div>
</header>
