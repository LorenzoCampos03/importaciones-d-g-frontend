<div class="login-container h-screen w-screen fixed inset-0 z-50">
  <div class="background-pattern absolute inset-0"></div>

  <div class="login-card-container relative w-full max-w-md">
    <div class="login-card">
      <div class="header-section">
        <div class="logo-container">
          <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
            ></path>
          </svg>
        </div>
        <h2 class="welcome-title">Bienvenido</h2>
        <p class="system-subtitle">Sistema de Importaciones D&G</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="username" class="form-label">Usuario</label>
          <div class="input-container">
            <div class="input-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
            </div>
            <input
              id="username"
              type="text"
              formControlName="username"
              class="form-input"
              [class.error]="isFieldInvalid('username')"
              placeholder="Ingrese su usuario"
            />
          </div>
          <div *ngIf="isFieldInvalid('username')" class="error-message">El usuario es requerido</div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-container">
            <div class="input-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                ></path>
              </svg>
            </div>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              class="form-input password-input"
              [class.error]="isFieldInvalid('password')"
              placeholder="Ingrese su contraseña"
            />
            <button type="button" (click)="togglePasswordVisibility()" class="password-toggle">
              <svg *ngIf="!showPassword" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                ></path>
              </svg>
              <svg *ngIf="showPassword" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"
                ></path>
              </svg>
            </button>
          </div>
          <div *ngIf="isFieldInvalid('password')" class="error-message">La contraseña es requerida</div>
        </div>
        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="submit-button"
          [class.loading]="isLoading"
        >
          <svg *ngIf="isLoading" class="loading-spinner" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </button>

        <div class="register-link">
          <p>
            ¿No tienes cuenta?
            <a routerLink="/register" class="link">Regístrate aquí</a>
          </p>
        </div>
      </form>

      <div class="footer-section">
        <p class="footer-text">
          ¿Problemas para acceder?
          <a href="#" class="link">Contacta soporte</a>
        </p>
      </div>
    </div>

    <div class="decoration-top"></div>
    <div class="decoration-bottom"></div>
  </div>
</div>
