<div class="client-form-container p-6 min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
     <div class="mb-8">
          <div class="flex items-center justify-between">
               <div class="flex items-center space-x-4">
                    <button (click)="goBack()"
                         class="bg-white hover:bg-gray-50 text-gray-700 p-3 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">
                         <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                              </path>
                         </svg>
                    </button>
                    <div>
                         <h1
                              class="text-4xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-2">
                              {{ getPageTitle() }}
                         </h1>
                         <p class="text-gray-600">{{ getPageDescription() }}</p>
                    </div>
               </div>
          </div>
     </div>

     <div *ngIf="isLoading" class="flex justify-center items-center py-12">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
     </div>

     <form *ngIf="!isLoading" (ngSubmit)="onSubmit()" class="max-w-4xl mx-auto">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
               <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-4">
                         <h2 class="text-xl font-bold text-white">Información Personal</h2>
                    </div>
                    <div class="p-6 space-y-6">
                         <div>
                              <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Nombre *</label>
                              <input type="text" id="name" name="name" [(ngModel)]="client.name" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Ingresa el nombre" />
                         </div>

                         <div>
                              <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">Apellido
                                   *</label>
                              <input type="text" id="lastName" name="lastName" [(ngModel)]="client.last_name" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Ingresa el apellido" />
                         </div>

                         <div>
                              <label for="documentType" class="block text-sm font-medium text-gray-700 mb-2">Tipo de
                                   Documento *</label>
                              <select id="documentType" name="documentType" [(ngModel)]="client.document_type" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                   <option value="" disabled>Selecciona un tipo</option>
                                   <option *ngFor="let type of documentTypes" [value]="type.value">{{ type.label }}
                                   </option>
                              </select>
                         </div>

                         <div>
                              <label for="documentNumber" class="block text-sm font-medium text-gray-700 mb-2">Número de
                                   Documento *</label>
                              <input type="text" id="documentNumber" name="documentNumber"
                                   [(ngModel)]="client.document_number" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Ingresa el número de documento" />
                         </div>

                         <div>
                              <label for="razonSocial" class="block text-sm font-medium text-gray-700 mb-2">Razón Social
                                   (Opcional)</label>
                              <input type="text" id="razonSocial" name="razonSocial" [(ngModel)]="client.razon_social"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Ingresa la razón social" />
                         </div>
                    </div>
               </div>

               <div class="space-y-8">
                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                         <div class="bg-gradient-to-r from-purple-600 to-pink-600 px-6 py-4">
                              <h2 class="text-xl font-bold text-white">Información de Contacto</h2>
                         </div>
                         <div class="p-6 space-y-6">
                              <div>
                                   <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Correo
                                        Electrónico *</label>
                                   <input type="email" id="email" name="email" [(ngModel)]="client.email" required
                                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="ejemplo@correo.com" />
                              </div>

                              <div>
                                   <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Teléfono
                                        *</label>
                                   <input type="tel" id="phone" name="phone" [(ngModel)]="client.phone" required
                                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="999 999 999" />
                              </div>

                              <div>
                                   <label for="address" class="block text-sm font-medium text-gray-700 mb-2">Dirección
                                        *</label>
                                   <textarea id="address" name="address" [(ngModel)]="client.address" required rows="3"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                                        placeholder="Ingresa la dirección completa"></textarea>
                              </div>
                         </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                         <div class="bg-gradient-to-r from-green-600 to-emerald-600 px-6 py-4">
                              <h2 class="text-xl font-bold text-white">Información de Usuario</h2>
                         </div>
                         <div class="p-6 space-y-6">
                              <div>
                                   <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Nombre de
                                        Usuario *</label>
                                   <input type="text" id="username" name="username" [(ngModel)]="client.username"
                                        required
                                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="usuario123" />
                              </div>

                              <div *ngIf="!isEditMode">
                                   <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Contraseña
                                        *</label>
                                   <input type="password" id="password" name="password" [(ngModel)]="password" required
                                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="Mínimo 6 caracteres" />
                              </div>

                              <div *ngIf="!isEditMode">
                                   <label for="confirmPassword"
                                        class="block text-sm font-medium text-gray-700 mb-2">Confirmar Contraseña
                                        *</label>
                                   <input type="password" id="confirmPassword" name="confirmPassword"
                                        [(ngModel)]="confirmPassword" required
                                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="Repite la contraseña" />
                              </div>

                              <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                                   <div class="flex items-start space-x-3">
                                        <svg class="w-5 h-5 text-blue-500 mt-0.5 flex-shrink-0" fill="none"
                                             stroke="currentColor" viewBox="0 0 24 24">
                                             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                        <div class="text-sm text-blue-700">
                                             <p class="font-medium mb-1">Información importante:</p>
                                             <ul class="list-disc list-inside space-y-1">
                                                  <li>El usuario será registrado con el rol de "Cliente"</li>
                                                  <li *ngIf="!isEditMode">La contraseña debe tener al menos 6 caracteres
                                                  </li>
                                                  <li>El email debe ser único en el sistema</li>
                                             </ul>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>
               </div>
          </div>

          <div class="mt-8 flex justify-end space-x-4">
               <button type="button" (click)="goBack()"
                    class="px-8 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl transition-all transform hover:scale-105">
                    Cancelar
               </button>
               <button type="submit" [disabled]="isLoading"
                    class="px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                    <div class="flex items-center space-x-2">
                         <svg *ngIf="isLoading" class="animate-spin w-5 h-5" fill="none" stroke="currentColor"
                              viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                   d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                              </path>
                         </svg>
                         <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7">
                              </path>
                         </svg>
                         <span>{{ isEditMode ? 'Actualizar Cliente' : 'Crear Cliente' }}</span>
                    </div>
               </button>
          </div>
     </form>
</div>
